  :root{
    --bg:#0b1a2b; --panel:#0f2438; --accent:#d4af37; --green:#57CB0A; --red:#FE0018; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  #bgFx{
    position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none;
    background:transparent;
  }
  body{
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:#0a1420; color:#eee; margin:0; padding:24px;
    display:flex; flex-direction:column; align-items:center; gap:20px;
    position:relative;
  }
  h1{font-size:20px; color:var(--accent); margin:0;}
  .layout{display:flex; gap:28px; flex-wrap:wrap; justify-content:center; width:100%; max-width:1200px;}
  .controls{
    background:var(--panel); border:1px solid #1e3a55; border-radius:12px; padding:20px;
    width:360px; display:flex; flex-direction:column; gap:14px;
  }
  .controls label{font-size:13px; color:#9fb4c9; display:block; margin-bottom:4px;}
  .controls input, .controls button{
    width:100%; padding:9px 10px; border-radius:6px; border:1px solid #2a4a6a;
    background:#0b1e30; color:#fff; font-size:15px;
  }
  .aed-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .aed-grid .full{grid-column:1 / -1;}
  .status{font-size:12px; padding:8px; border-radius:6px; background:#0b1e30; line-height:1.5;}
  .status.ok{color:#7CE07C;}
  .status.err{color:#ff8a8a;}
  .status.wait{color:#f4d35e;}
  button.primary{
    background:var(--accent); color:#1a1a1a; font-weight:700; cursor:pointer; border:none; padding:13px;
    font-size:16px;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.primary:disabled{opacity:.5; cursor:not-allowed;}
  button.secondary{
    background:transparent; color:var(--accent); font-weight:600; cursor:pointer;
    border:1px solid #3a5a78; padding:10px; font-size:14px; border-radius:6px;
  }
  button.secondary:hover{background:rgba(212,175,55,0.08);}
  button.secondary:disabled{opacity:.5; cursor:not-allowed;}
  .fetch-note{font-size:11px; color:#7ea0bd; line-height:1.5; padding:0 2px;}
  .spinner{
    display:inline-block; width:11px; height:11px; margin-inline-end:6px;
    border:2px solid rgba(212,175,55,0.25); border-top-color:var(--accent);
    border-radius:50%; animation:spin 0.7s linear infinite; vertical-align:middle;
  }
  .spinner.hidden{display:none;}
  @keyframes spin{ to { transform:rotate(360deg); } }
  #card{
    border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.5); max-width:420px; width:100%; height:auto;
    background:#000;
  }
  .canvas-wrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  a.download{
    background:#1f8a3d; color:#fff; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:700;
    pointer-events:none; opacity:.4;
  }
  a.download.ready{pointer-events:auto; opacity:1;}
  details{background:var(--panel); border-radius:10px; padding:14px 18px; width:100%; max-width:1200px; color:#bcd; font-size:13px; line-height:1.6;}
  summary{cursor:pointer; color:var(--accent); font-weight:700;}
  code{background:#0b1e30; padding:1px 5px; border-radius:4px;}
  .karat-label{font-size:12px; color:#6fa; opacity:.8;}
  .credit{
    position:fixed; bottom:10px; left:14px; font-size:11px; color:#6d859c; opacity:.75;
    z-index:50;
  }
  .credit a{color:#9fc4e0; text-decoration:none;}
  .credit a:hover{text-decoration:underline;}
  .version-tag{
    position:fixed; bottom:10px; right:14px; font-size:11px; color:#6d859c; opacity:.6;
    z-index:50; font-family:monospace;
  }
</style>

// Matches the original PSD's fonts exactly (Avenir Black for the big price
// numbers, Avenir Medium for the date/time — same as the source file).
const PRICE_FONT_FAMILY = "'Avenir Black', Arial, sans-serif";

// Font sizes calibrated directly against the PSD's own glyph bounding

const FONT = `900 42px ${PRICE_FONT_FAMILY}`;

// Outer glow, matched to the PSD's OuterGlow effect on the price numbers
// and title: color rgb(254,194,0), 35% opacity, 38px blur (document-scale,

const GLOW_COLOR = 'rgba(254,194,0,0.35)';
const GLOW_BLUR = 19;

// =====================================================================
// Sound effects — synthesized directly with the Web Audio API, so there
// are no audio files to load or host. Kept deliberately quiet/short.
// =====================================================================
let soundEnabled = true; // always on — no mute toggle in the UI
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, delay = 0, volume = 0.05, type = 'sine') {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + delay;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  } catch (e) { /* Web Audio unsupported or blocked — fail silently */ }
}
function playClickSound() { playTone(680, 0.05, 0, 0.04); }
function playSuccessChime() { playTone(880, 0.12, 0, 0.05); playTone(1318.5, 0.16, 0.08, 0.05); }

// =====================================================================
// Subtle gold-particle background, drifting slowly with a gentle
// parallax toward the mouse. Deliberately lightweight: a few dozen
// small circles, no blur/shadow filters, pauses when the tab is hidden.
// =====================================================================
(function initBackgroundFx() {
  const fxCanvas = document.getElementById('bgFx');
  const fxCtx = fxCanvas.getContext('2d');
  let W = 0, H = 0;
  function resize() {
    W = fxCanvas.width = window.innerWidth;
    H = fxCanvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  let mouseX = W / 2, mouseY = H / 2;
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  window.addEventListener('touchmove', e => {
    if (e.touches && e.touches[0]) { mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; }
  }, { passive: true });

  const COUNT = window.innerWidth < 700 ? 22 : 40; // fewer particles on small/mobile screens
  const particles = Array.from({ length: COUNT }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    r: 0.8 + Math.random() * 2.0,
    vx: (Math.random() - 0.5) * 0.12,
    vy: (Math.random() - 0.5) * 0.12,
    tw: Math.random() * Math.PI * 2,
  }));

  function tick() {
    fxCtx.clearRect(0, 0, W, H);
    const dx = (mouseX - W / 2) * 0.012;
    const dy = (mouseY - H / 2) * 0.012;
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -5) p.x = W + 5; else if (p.x > W + 5) p.x = -5;
      if (p.y < -5) p.y = H + 5; else if (p.y > H + 5) p.y = -5;
      p.tw += 0.015;
      const twinkle = 0.4 + 0.6 * Math.sin(p.tw);
      fxCtx.beginPath();
      fxCtx.arc(p.x + dx, p.y + dy, p.r, 0, Math.PI * 2);
      fxCtx.fillStyle = `rgba(212,175,55,${(0.2 + 0.35 * twinkle).toFixed(3)})`;
      fxCtx.fill();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

canvas.setAttribute('dir', 'ltr');
const ctx = canvas.getContext('2d');
ctx.direction = 'ltr'; // prevents "10:00 AM" rendering as "AM 10:00" under the page's RTL context

const statusEl = document.getElementById('status');
function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (cls || 'wait');
}

function todayDubai() {
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Dubai', day:'2-digit', month:'2-digit', year:'numeric' });
  const parts = fmt.formatToParts(new Date());
  const d = {}; parts.forEach(p => d[p.type] = p.value);
  return { display: `${d.day}.${d.month}.${d.year}`, iso: `${d.year}-${d.month}-${d.day}` };
}

function yesterdayIso(iso) {
  const dt = new Date(iso + 'T12:00:00Z');
  dt.setUTCDate(dt.getUTCDate() - 1);
  return dt.toISOString().slice(0,10);
}

function to12h(hhmm) {
  let [h, m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1);
}

async function fetchFx(dateIso) {
  // Source: fawazahmed0/exchange-api (github.com/fawazahmed0/exchange-api) —
  // free, keyless, no rate limits. Tries jsDelivr first (fastest), falls
  // back to the pages.dev mirror if jsDelivr is ever unreachable, per the
  // project's own recommended fallback order.
  const ver = dateIso || 'latest';
  const urls = [
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${ver}/v1/currencies/aed.min.json`,
    `https://${ver}.currency-api.pages.dev/v1/currencies/aed.min.json`,
    `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${ver}/v1/currencies/aed.json`,
    `https://${ver}.currency-api.pages.dev/v1/currencies/aed.json`,
  ];
  for (const url of urls) {
    try {
      const res = await fetch(url);
      if (!res.ok) continue;
      const json = await res.json();
      return json.aed;
    } catch (e) { /* try next */ }
  }
  throw new Error('تعذر جلب أسعار الصرف');
}

async function fetchRows() {
  if (!SHEET_CSV_URL || SHEET_CSV_URL.startsWith('PASTE_')) return [];
  try {
    const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) return [];
    const text = await res.text();
    const rows = parseCSV(text).slice(1).filter(r => r.length >= 6 && r[1] !== '');
    return rows.map(r => ({
      timestamp: r[0],
      aed: { '24': +r[1], '22': +r[2], '21': +r[3], '18': +r[4], '14': +r[5] },
    }));
  } catch (e) {
    return [];
  }
}

function isSameDubaiDay(timestampStr, todayIso) {
  const d = new Date(timestampStr);
  if (isNaN(d)) return false;
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Dubai', year:'numeric', month:'2-digit', day:'2-digit' });
  return fmt.format(d) === todayIso; // en-CA gives YYYY-MM-DD, matching todayIso's format
}

function submitToSheet(todayAed) {
  if (!FORM_ACTION_URL || FORM_ACTION_URL.startsWith('PASTE_')) return; // not configured, skip silently
  const body = new URLSearchParams();
  body.set(ENTRY_IDS['24'], todayAed['24']);
  body.set(ENTRY_IDS['22'], todayAed['22']);
  body.set(ENTRY_IDS['21'], todayAed['21']);
  body.set(ENTRY_IDS['18'], todayAed['18']);
  body.set(ENTRY_IDS['14'], todayAed['14']);
  // no-cors: fire-and-forget, response is opaque but the submission goes through
  fetch(FORM_ACTION_URL, { method: 'POST', mode: 'no-cors', body }).catch(() => {});
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// After submitting, re-read the sheet and check a new row actually landed
// with today's numbers — mode:'no-cors' means we can't trust the fetch()
// response alone, so we verify by observation instead of assuming success.
async function verifySaved(todayAed, priorRowCount) {
  for (const delayMs of [1500, 2500, 4000]) {
    await sleep(delayMs);
    const rows = await fetchRows();
    if (rows.length > priorRowCount) {
      const last = rows[rows.length - 1].aed;
      const matches = ['24','22','21','18','14'].every(k => Math.abs(last[k] - todayAed[k]) < 0.005);
      if (matches) return true;
    }
  }
  return false;
}

// =====================================================================
// Manual "fetch prices" button — pulls today's AED prices directly from
// Dubai City of Gold (the same organization already credited at the
// bottom of the card). Browsers block a page from calling another site's
// server directly (CORS), so this goes through small public relays that
// simply re-serve the page with permissive headers. All relays are tried
// in parallel (not one-by-one) so a single slow/dead one can't hold up the
// others — we resolve as soon as the first one succeeds. If every relay
// fails, the fields are left alone and a plain message asks for manual
// entry — nothing here ever blocks generating the card by hand.
// =====================================================================
const GOLD_SOURCE_URL = 'https://dubaicityofgold.com/';
const CORS_RELAYS = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
  url => `https://corsfix.com/${url}`,
  url => `https://cors.x2u.in/${url}`,
  // corsproxy.io removed: as of 2026 its free tier only serves localhost
  // requests and returns HTTP 401 for real sites — a permanent dead end,
  // not a transient failure.
];
const RELAY_TIMEOUT_MS = 12000; // generous, since relays now run in parallel rather than one-by-one — this is the worst case, not a per-attempt tax

async function attemptRelay(makeUrl, timeoutMs) {
  const relayUrl = makeUrl(GOLD_SOURCE_URL);
  const relayHost = new URL(relayUrl).hostname;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(relayUrl, { cache: 'no-store', signal: controller.signal });
    clearTimeout(timer);
    if (!res.ok) return { relayHost, ok: false, reason: `HTTP ${res.status}` };
    const html = await res.text();
    if (!html || html.length < 1000) return { relayHost, ok: false, reason: `content too short (${html ? html.length : 0} chars)` };
    return { relayHost, ok: true, html, reason: `OK (${html.length} chars)` };
  } catch (e) {
    clearTimeout(timer);
    return { relayHost, ok: false, reason: e.name === 'AbortError' ? `timed out after ${timeoutMs / 1000}s` : e.message };
  }
}

// Fires all relays at once and resolves the moment the first one succeeds,
// rather than waiting on each in turn. Always logs every relay's outcome
// (for diagnosing failures in the console) even after an early success.
function fetchGoldSourceHtml() {
  const attempts = CORS_RELAYS.map(makeUrl => attemptRelay(makeUrl, RELAY_TIMEOUT_MS));
  const attemptLog = [];
  return new Promise(resolve => {
    let settled = 0;
    let resolved = false;
    attempts.forEach(p => {
      p.then(result => {
        attemptLog.push(`${result.relayHost}: ${result.reason}`);
        if (!resolved && result.ok) {
          resolved = true;
          resolve({ html: result.html, log: attemptLog });
        }
      }).finally(() => {
        settled++;
        if (settled === attempts.length && !resolved) resolve({ html: null, log: attemptLog });
      });
    });
  });
}

function parseGoldPricesFromHtml(html) {
  // Matches pairs like:
  // <span class="sortd-gold-type">24K Gold</span> ... <span class="sortd-gold-value">AED 559.25</span>
  const re = /sortd-gold-type[^>]*>\s*(\d+)K\s*Gold\s*<\/span>\s*<span[^>]*sortd-gold-value[^>]*>\s*AED\s*([\d,.]+)\s*<\/span>/gi;
  const found = {};
  let m;
  while ((m = re.exec(html)) !== null) {
    const karat = m[1];
    const val = parseFloat(m[2].replace(/,/g, ''));
    if (['24','22','21','18','14'].includes(karat) && !isNaN(val)) found[karat] = val;
  }
  return found;
}

function playFetchSuccessChime() {
  // Short, clearly-audible mechanical "beep-beep" — square wave (electronic
  // buzzer character, not a soft musical tone) at a higher volume than the
  // other sounds since this one specifically needed to be heard.
  playTone(1000, 0.09, 0,    0.16, 'square');
  playTone(1000, 0.09, 0.14, 0.16, 'square');
}

document.getElementById('fetchPricesBtn').addEventListener('click', async () => {
  playClickSound();
  const btn = document.getElementById('fetchPricesBtn');
  const note = document.getElementById('fetchNote');
  const noteText = document.getElementById('fetchNoteText');
  const spinner = document.getElementById('fetchSpinner');
  btn.disabled = true;
  spinner.classList.remove('hidden');
  noteText.textContent = 'جارِ الجلب من Dubai City of Gold...';
  try {
    const { html, log } = await fetchGoldSourceHtml();
    if (!html) {
      console.warn('[gold-card] Could not reach the source through any relay:\n' + log.join('\n'));
      throw new Error('unreachable');
    }

    const prices = parseGoldPricesFromHtml(html);
    const gotAll = ['24','22','21','18','14'].every(k => prices[k] != null);
    if (!gotAll) {
      console.warn(
        '[gold-card] Reached the source page but could not find all 5 prices in it — the site\'s layout may have changed.\n' +
        `Relay log:\n${log.join('\n')}\n` +
        `Prices found: ${JSON.stringify(prices)}\n` +
        `First 500 chars of fetched HTML for inspection:\n${html.slice(0, 500)}`
      );
      throw new Error('incomplete');
    }

    document.getElementById('aed24').value = prices['24'];
    document.getElementById('aed22').value = prices['22'];
    document.getElementById('aed21').value = prices['21'];
    document.getElementById('aed18').value = prices['18'];
    document.getElementById('aed14').value = prices['14'];

    const now = new Intl.DateTimeFormat('ar', { timeZone: 'Asia/Dubai', hour: '2-digit', minute: '2-digit' }).format(new Date());
    noteText.textContent = `تم الجلب من Dubai City of Gold الساعة ${now} ✓ — راجع الأرقام ثم اضغط "إنشاء البطاقة"`;
    playFetchSuccessChime();
  } catch (e) {
    noteText.textContent = 'تعذر الجلب التلقائي هذه المرة — الرجاء إدخال الأسعار يدويًا أدناه.';
  } finally {
    spinner.classList.add('hidden');
    btn.disabled = false;
  }
});

let currentData = null;

// Plays once whenever the person actually clicks the download button (and
// there's a real image ready) — not just whenever a card is generated.
document.getElementById('downloadLink').addEventListener('click', function () {
  if (this.classList.contains('ready')) playSuccessChime();
});

document.getElementById('goBtn').addEventListener('click', async () => {
  playClickSound();
  const todayAed = {
    '24': +document.getElementById('aed24').value,
    '22': +document.getElementById('aed22').value,
    '21': +document.getElementById('aed21').value,
    '18': +document.getElementById('aed18').value,
    '14': +document.getElementById('aed14').value,
  };
  if (Object.values(todayAed).some(v => !v && v !== 0)) {
    setStatus('الرجاء تعبئة كل الأسعار الخمسة أولاً.', 'err'); return;
  }

  document.getElementById('goBtn').disabled = true;
  setStatus('لحظات من فضلك...', 'wait');
  try {
    const { iso: todayIso } = todayDubai();

    // Pull the full history BEFORE submitting anything, so we can tell:
    // (a) whether today was already submitted earlier, and
    // (b) the true "yesterday" row for the color comparison, even if
    //     today already has one or more entries.
    const rows = await fetchRows();
    const lastRow = rows.length ? rows[rows.length - 1] : null;
    const alreadySubmittedToday = lastRow && isSameDubaiDay(lastRow.timestamp, todayIso);
    const priorRows = alreadySubmittedToday
      ? rows.filter(r => !isSameDubaiDay(r.timestamp, todayIso))
      : rows;
    const yestAed = priorRows.length ? priorRows[priorRows.length - 1].aed : null;

    let proceedToSubmit = true;
    if (alreadySubmittedToday) {
      proceedToSubmit = confirm(
        `تم حفظ أسعار اليوم مسبقًا (آخر حفظ: ${lastRow.timestamp}).\n` +
        `هل تريد حفظ هذه القيم كإدخال إضافي لهذا اليوم؟\n` +
        `(اضغط "إلغاء" لعرض البطاقة فقط دون الحفظ مرة أخرى)`
      );
    }

    if (proceedToSubmit) submitToSheet(todayAed);

    const fxToday = await fetchFx(null);
    let fxYest = fxToday;
    if (yestAed) {
      try { fxYest = await fetchFx(yesterdayIso(todayIso)); } catch (e) { /* fall back to today's rate */ }
    }

    currentData = { todayAed, yestAed, fxToday, fxYest };
    draw(currentData);

    const link = document.getElementById('downloadLink');
    link.href = canvas.toDataURL('image/png');
    link.classList.add('ready');

    if (SHEET_CSV_URL.startsWith('PASTE_')) {
      setStatus('تم إنشاء البطاقة ✓', 'ok');
    } else if (!proceedToSubmit) {
      setStatus('تم إنشاء البطاقة ✓', 'ok');
    } else {
      setStatus('تم إنشاء البطاقة، لحظات من فضلك...', 'wait');
      const saved = await verifySaved(todayAed, rows.length);
      if (saved) {
        setStatus('تم إنشاء البطاقة وحفظها بنجاح ✓', 'ok');
      } else {
        // Friendly, non-alarming message for whoever's using the page —
        // the real technical detail goes to the console for the admin only.
        setStatus('تم إنشاء البطاقة ✓ (قد يستغرق حفظ البيانات بضع لحظات إضافية)', 'wait');
        console.warn(
          '[gold-card] Could not confirm the row was saved to the Google Sheet within the expected time.\n' +
          'Checklist: (1) page is hosted over https:// (GitHub Pages), not opened as a local file; ' +
          '(2) FORM_ACTION_URL ends in /formResponse; (3) ENTRY_IDS map to the correct questions; ' +
          '(4) the Google Form allows responses without sign-in.'
        );
      }
    }
  } catch (e) {
    setStatus('حدث خطأ بسيط، حاول مرة أخرى.', 'err');
    console.warn('[gold-card] Unexpected error:', e);
  } finally {
    document.getElementById('goBtn').disabled = false;
  }
});

document.getElementById('timeInput').addEventListener('change', () => {
  draw(currentData);
  if (currentData) {
    const link = document.getElementById('downloadLink');
    link.href = canvas.toDataURL('image/png');
  }
});

function computeCell(karat, ccy, data) {
  const rate = data.fxToday[ccy];
  const todayVal = data.todayAed[karat] * (ccy === 'aed' ? 1 : rate);
  let color = COLORS.same;
  if (data.yestAed && data.yestAed[karat] != null) {
    const yRate = (data.fxYest && data.fxYest[ccy]) ? data.fxYest[ccy] : rate;
    const yestVal = data.yestAed[karat] * (ccy === 'aed' ? 1 : yRate);
    const diff = todayVal - yestVal;
    if (Math.abs(diff) < 0.005) color = COLORS.same;
    else color = diff > 0 ? COLORS.up : COLORS.down;
  }
  return { val: todayVal, color };
}

function draw(data) {
  ctx.clearRect(0,0,canvas.width, canvas.height);
  if (bgLoaded) ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

  const { display: dateStr } = todayDubai();
  const timeStr = to12h(document.getElementById('timeInput').value || '10:00');
  ctx.textAlign = 'right';
  ctx.fillStyle = '#FFFFFF';
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  ctx.font = DATE_FONT;
  ctx.fillText(dateStr, 978, 100);
  ctx.font = TIME_FONT;
  ctx.fillText(timeStr, 978, 135);

  if (data) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const MAX_CELL_WIDTH = 170; // column width minus padding, so text never touches the divider lines
    ROWS.forEach(row => {
      ['eur','usd','sar','aed'].forEach(ccy => {
        const { val, color } = computeCell(row.key, ccy, data);
        const text = val.toFixed(2);

        // shrink the font if a wider-than-usual number would touch the column edges
        let size = 42;
        ctx.font = `900 ${size}px ${PRICE_FONT_FAMILY}`;
        while (ctx.measureText(text).width > MAX_CELL_WIDTH && size > 24) {
          size -= 2;
          ctx.font = `900 ${size}px ${PRICE_FONT_FAMILY}`;
        }

        // outer glow pass (matches the PSD's OuterGlow effect on these layers)
        ctx.save();
        ctx.shadowColor = GLOW_COLOR;
        ctx.shadowBlur = GLOW_BLUR;
        ctx.fillStyle = color;
        ctx.fillText(text, COL_X[ccy], row.y);
        ctx.restore();

        // crisp text on top, no shadow
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
        ctx.fillStyle = color;
        ctx.fillText(text, COL_X[ccy], row.y);
      });
    });
  }
}

document.getElementById('versionTag').textContent = APP_VERSION;
draw(null);

// Auto-refresh so an open tab never keeps running a stale version once
// you've pushed an update.
setTimeout(() => location.reload(), AUTO_REFRESH_HOURS * 60 * 60 * 1000);
